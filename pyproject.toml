[project]
name = "sure-web-testing"
version = "0.2.0"
description = "Persistent, step-by-step interactive browser testing with MCP server and CLI"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.50",
]

[project.optional-dependencies]
google-vision = [
    "google-genai>=1.0",
]
openai-vision = [
    "openai>=1.0",
]
openrouter-vision = [
    "openai>=1.0",
]
all-vision = [
    "sure-web-testing[google-vision,openai-vision,openrouter-vision]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
    "sure-web-testing[all-vision]",
]

[project.scripts]
sure-web-testing = "src.cli:main"
sure-web-testing-server = "src.server:main"

[tool.setuptools]
# The package IS `src`, rooted at the repository: every module imports its
# siblings as `src.X` and the console scripts say `src.cli:main`. Without
# this declaration setuptools auto-detects the src-layout and puts ROOT/src
# on sys.path instead — `import src` then fails and both entry points die
# with ModuleNotFoundError (seen 2026-10-09).
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false
