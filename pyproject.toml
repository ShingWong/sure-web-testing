[project]
name = "agentic-web-testing"
version = "0.1.0"
description = "Persistent, step-by-step interactive browser testing with MCP server and CLI"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.50",
]

[project.optional-dependencies]
google-vision = [
    "google-genai>=1.0",
]
openai-vision = [
    "openai>=1.0",
]
openrouter-vision = [
    "openai>=1.0",
]
all-vision = [
    "agentic-web-testing[google-vision,openai-vision,openrouter-vision]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
    "agentic-web-testing[all-vision]",
]

[project.scripts]
awt = "src.cli:main"
awt-server = "src.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false
